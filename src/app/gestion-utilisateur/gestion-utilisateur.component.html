<app-sidebar></app-sidebar>

  <!-- Main Content -->
  <div class="main-content">
    <div class="action-bar">
      <div class="search-bar">
        <mat-form-field appearance="outline">
          <mat-label>Rechercher un utilisateur</mat-label>
          <input matInput type="text" [(ngModel)]="searchTerm">
          <button matSuffix mat-icon-button>
            <mat-icon>search</mat-icon>
          </button>
        </mat-form-field>
      </div>
      <button mat-raised-button color="primary" class="add-button">
        <mat-icon>add</mat-icon>
        Ajouter
      </button>
    </div>

    <table mat-table [dataSource]="paginatedUsers" class="users-table">
      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let user">{{ user.nom }}</td>
      </ng-container>

      <ng-container matColumnDef="prenom">
        <th mat-header-cell *matHeaderCellDef>Prénom</th>
        <td mat-cell *matCellDef="let user">{{ user.prenom }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let user">
          <span [class]="'status-badge ' + (user.role === 'Admin' ? 'status-admin' : 'status-user')">
            {{ user.role }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <div class="action-buttons">
            <button mat-icon-button color="warn" (click)="deleteUser(user.id)">
              <mat-icon Mat-tooltip = "Supprimer">delete</mat-icon>
             
            </button>
            <button mat-icon-button color="primary" [routerLink]="['edit', user.id]">
              <mat-icon mat-toolip = "Modifier">edit</mat-icon>
             
            </button>
            <button mat-icon-button color="accent" (click)="toggleUserRole(user)">
              <mat-icon mat-tooltip = "Changer le rôle">swap_horiz</mat-icon>
             
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="filteredUsers.length"
                  [pageSize]="itemsPerPage"
                  [pageSizeOptions]="[5, 10, 20]"
                  (page)="currentPage = $event.pageIndex + 1">
    </mat-paginator>
  </div>
