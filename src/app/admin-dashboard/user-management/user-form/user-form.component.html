<!-- user-form/user-form.component.html -->

<div class="modal-container">
  <h2>{{ isEdit ? 'Modifier' : 'Ajouter' }} un utilisateur</h2>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nom">Nom</label>
      <input id="nom" type="text" formControlName="nom">
      <div class="error" *ngIf="userForm.get('nom')?.errors?.['required'] && userForm.get('nom')?.touched">
        Le nom est requis
      </div>
    </div>

    <div class="form-group">
      <label for="prenom">Prénom</label>
      <input id="prenom" type="text" formControlName="prenom">
      <div class="error" *ngIf="userForm.get('prenom')?.errors?.['required'] && userForm.get('prenom')?.touched">
        Le prénom est requis
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email">
      <div class="error" *ngIf="userForm.get('email')?.errors?.['email'] && userForm.get('email')?.touched">
        Email invalide
      </div>
    </div>

    <div class="form-group">
      <label for="statut">Statut</label>
      <select id="statut" formControlName="statut">
        <option value="User">User</option>
        <option value="Admin">Admin</option>
      </select>
    </div>

    <div class="button-group">
      <button type="button" (click)="dialogRef.close()">Annuler</button>
      <button type="submit" [disabled]="!userForm.valid">
        {{ isEdit ? 'Modifier' : 'Ajouter' }}
      </button>
    </div>
  </form>
</div>
