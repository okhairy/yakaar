

<app-sidebar></app-sidebar>
<div class="container mx-auto p-4">
    <!-- En-tête avec barre de recherche -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Gestion des utilisateurs</h1>
      <div class="flex gap-4">
        <mat-form-field>
          <mat-label>Rechercher</mat-label>
<input matInput [(ngModel)]="searchTerm" (keyup.enter)="onSearch()">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
       <div>
  <!-- Bouton pour afficher la modal -->
  <button mat-raised-button color="primary" (click)="openModal()">
    <mat-icon>add</mat-icon>
    Nouvel utilisateur
  </button>
</div>

<!-- Modal -->
<div class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center" *ngIf="showAddForm">
    <div class="modal-content bg-white rounded-lg shadow-lg p-8 max-w-lg w-full">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">
        {{ editingUser ? 'Modifier' : 'Ajouter' }} un utilisateur
      </h2>
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 gap-6">
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Prénom</mat-label>
            <input matInput formControlName="prenom" placeholder="Entrez le prénom">
          </mat-form-field> <br>
  
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Nom</mat-label>
            <input matInput formControlName="nom" placeholder="Entrez le nom">
          </mat-form-field><br>
  
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" placeholder="Entrez l'adresse email">
          </mat-form-field><br>
  
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Rôle</mat-label>
            <mat-select formControlName="role">
              <mat-option value="User">Utilisateur</mat-option>
              <mat-option value="Admin">Administrateur</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
  
        <div class="flex justify-end gap-4 mt-6">
          <button mat-button type="button" class="text-red-500 hover:bg-red-50" (click)="closeModal()">Annuler</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid">
            {{ editingUser ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </form>
    </div>
  </div>
  

    <!-- Table des utilisateurs -->
    <mat-table [dataSource]="users" class="mat-elevation-z8">
      <!-- Colonnes de la table -->
      <ng-container matColumnDef="prenom">
        <mat-header-cell *matHeaderCellDef>Prénom</mat-header-cell>
        <mat-cell *matCellDef="let user">{{user.prenom}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="nom">
        <mat-header-cell *matHeaderCellDef>Nom</mat-header-cell>
        <mat-cell *matCellDef="let user">{{user.nom}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="email">
        <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
        <mat-cell *matCellDef="let user">{{user.email}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="role">
        <mat-header-cell *matHeaderCellDef>Rôle</mat-header-cell>
        <mat-cell *matCellDef="let user">
          <mat-slide-toggle
            [checked]="user.role === 'Admin'"
            (change)="toggleUserRole(user)"
            [disabled]="user._id === currentUserId">
            {{user.role}}
          </mat-slide-toggle>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef>Statut</mat-header-cell>
        <mat-cell *matCellDef="let user">
          <mat-slide-toggle
            [checked]="user.status"
            (change)="updateUserStatus(user)"
            [disabled]="user._id === currentUserId">
            {{user.status ? 'Actif' : 'Inactif'}}
          </mat-slide-toggle>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
        <mat-cell *matCellDef="let user">
          <button mat-icon-button color="primary" (click)="startEdit(user)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser(user)" [disabled]="user._id === currentUserId">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <mat-paginator
      [length]="totalUsers"
      [pageSize]="itemsPerPage"
      [pageSizeOptions]="[8, 16, 24]"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
